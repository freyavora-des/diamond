<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rings — Diamond Forest</title>
    <meta name="description" content="Rings collection." />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="container">
        <div class="topbar__row">
          <a class="brand" href="../../">Diamond Forest</a>
          <nav class="nav" aria-label="Primary">
            <a href="../../">Shop</a>
            <a href="../../about/">About</a>
            <a href="../../contact/">Contact</a>
          </nav>
          <div class="actions">
            <a class="pill" href="./" aria-current="page">Rings</a>
            <button class="iconbtn" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false" data-drawer-open>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <aside id="drawer" class="drawer" aria-hidden="true" data-drawer>
      <div class="drawer__backdrop" data-drawer-backdrop></div>
      <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer__top">
          <div class="brand">Diamond Forest</div>
          <button class="iconbtn" type="button" aria-label="Close menu" data-drawer-close>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <nav class="drawer__nav" aria-label="Mobile">
          <a href="../../">Shop <span class="chev" aria-hidden="true">›</span></a>
          <a href="../../about/">About <span class="chev" aria-hidden="true">›</span></a>
          <a href="../../contact/">Contact <span class="chev" aria-hidden="true">›</span></a>
        </nav>
      </div>
    </aside>

    <main id="main">
      <section class="section">
        <div class="container">
          <div class="section__head">
            <h1 class="h1" style="font-size: 42px; margin: 0">Rings</h1>
            <div class="muted" style="margin: 0">Signature Rings Collection</div>
          </div>

          <div class="grid">
            <article class="card">
              <a href="../../product/forest-bloom-ring/">
                <img class="card__img" src="../../assets/img/img-1bc85e13ba22.webp" alt="Forest Bloom Ring" loading="lazy" decoding="async" />
              </a>
              <div class="card__body">
                <h3 class="card__name">Forest Bloom Ring</h3>
                <div class="card__meta"><span>$1897</span><span>Rings</span></div>
                <div class="card__actions">
                  <a class="btn btn--primary" href="../../product/forest-bloom-ring/">View</a>
                  <a class="btn" href="../../contact/">Inquire</a>
                </div>
              </div>
            </article>

            <article class="card">
              <a href="../../product/fressia-hidden-halo-diamonds-ring/">
                <img class="card__img" src="../../assets/img/img-6ab5dfe8176e.avif" alt="Fressia Hidden Halo Diamonds Ring" loading="lazy" decoding="async" />
              </a>
              <div class="card__body">
                <h3 class="card__name">Fressia Hidden Halo Diamonds Ring</h3>
                <div class="card__meta"><span>$1897</span><span>Rings</span></div>
                <div class="card__actions">
                  <a class="btn btn--primary" href="../../product/fressia-hidden-halo-diamonds-ring/">View</a>
                  <a class="btn" href="../../contact/">Inquire</a>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="fineprint">© 2025 Diamond Atelier. All rights reserved.</div>
      </div>
    </footer>

    <script src="../../app.js"></script>
